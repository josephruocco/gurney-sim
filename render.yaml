services:
  - type: web
    name: gurney-relay
    runtime: docker
    plan: starter
    region: virginia
    numInstances: 1
    dockerfilePath: ./relay/Dockerfile
    dockerContext: ./relay
    autoDeployTrigger: off
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 10000
# Keep one instance because room membership is held in memory.
